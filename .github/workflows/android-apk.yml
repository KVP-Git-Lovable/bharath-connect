name: Build Android APK

# Manual, on-demand build only — this never runs automatically on push, so it
# never adds to normal CI cost. Trigger it from the Actions tab ("Run
# workflow") whenever you need a fresh installable build.
#
# Produces a DEBUG build only. There is no release keystore checked into this
# repo (by design — signing keys don't belong in git), so this cannot produce
# a Play-Store-signable release APK. A debug APK installs fine on a device
# with "install unknown apps" enabled and is sufficient for internal testing.
#
# Nothing about the app (name, icon, permissions, package id) is changed by
# this workflow — it builds exactly what's committed on the branch you run it
# from, via this repo's own existing `sync:android` script.
on:
  workflow_dispatch: {}

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS dependencies
        run: bun install

      - name: Build web assets
        run: bun run build

      - name: Sync Capacitor Android (patches + cap sync)
        run: bun run sync:android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Pre-install SDK platform (best effort — AGP can also auto-download)
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bharath-connect-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

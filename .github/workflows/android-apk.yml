name: Build Android APK

# Manual, on-demand build only — this never runs automatically on push, so it
# never adds to normal CI cost. Trigger it from the Actions tab ("Run
# workflow") whenever you need a fresh installable build.
#
# Produces a DEBUG build only. There is no release keystore checked into this
# repo (by design — signing keys don't belong in git), so this cannot produce
# a Play-Store-signable release APK. A debug APK installs fine on a device
# with "install unknown apps" enabled and is sufficient for internal testing.
#
# Nothing about the app (name, icon, permissions, package id) is changed by
# this workflow — those all come from capacitor.config.ts / AndroidManifest /
# assets, untouched here either way.
#
# Web content source: this repo migrated to TanStack Start (full SSR, builds
# a Cloudflare Worker bundle to .output/, no static dist/ or index.html is
# produced anywhere, and none exists in git). capacitor.config.ts's default
# ("bundle local dist/ into the APK") can't work against that output shape —
# it would fail identically for a local build, not just CI. So this workflow
# builds with CAP_REMOTE=1, capacitor.config.ts's own documented escape
# hatch, which points the APK at the live hosted site instead of a local
# bundle. A minimal placeholder dist/index.html is created in the runner
# only (never committed) purely so `cap sync`'s asset-copy step has
# something to copy — it's not what the installed app actually shows.
on:
  workflow_dispatch: {}

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS dependencies
        run: bun install

      - name: Create placeholder dist/ (CAP_REMOTE mode doesn't use local web assets)
        run: |
          mkdir -p dist
          echo '<!doctype html><html><head><meta charset="utf-8"></head><body></body></html>' > dist/index.html

      - name: Sync Capacitor Android (patches + cap sync, remote web content)
        env:
          CAP_REMOTE: "1"
        run: bun run sync:android

      - name: Accept SDK licenses & install required platform
        # ubuntu-latest runners ship with the Android SDK pre-installed
        # (ANDROID_HOME already set) — no setup action needed.
        # android-actions/setup-android@v3 was tried here and crashes: it
        # tries to install the long-removed legacy "tools" package, which
        # Google's SDK repository no longer serves.
        # sdkmanager itself isn't directly on PATH — it's nested under
        # cmdline-tools/<version>/bin — so locate it rather than guess the
        # version folder, and add it (+ platform-tools) to PATH for later
        # steps.
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "Using Android SDK root: $SDK_ROOT"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 2 -name sdkmanager -type f | sort -r | head -1)"
          echo "Using sdkmanager: $SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses --sdk_root="$SDK_ROOT" >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bharath-connect-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
